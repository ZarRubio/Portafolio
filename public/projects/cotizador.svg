<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <!-- Illustration (fictitious data) of the mobile quoting flow: phone → signed link → customer approval. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1d21"/>
      <stop offset="1" stop-color="#081214"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="18" fill="url(#bg)"/>
  <g opacity="0.25" stroke="#2dd4bf">
    <path d="M0 420 C200 360 300 470 520 400 S760 330 800 360" fill="none"/>
  </g>

  <!-- phone -->
  <rect x="90" y="30" width="250" height="440" rx="34" fill="#10262b" stroke="#2f5359" stroke-width="3"/>
  <rect x="180" y="44" width="70" height="10" rx="5" fill="#1f3d43"/>
  <text x="115" y="92" fill="#7f9592" font-size="12">Nueva cotización</text>
  <text x="115" y="116" fill="#e8f1ef" font-size="18" font-weight="700">Cliente: Taller Ejemplo</text>
  <g font-size="13" fill="#cfe3e0">
    <rect x="110" y="134" width="210" height="52" rx="10" fill="#0c1d21"/>
    <text x="124" y="156">Llanta 90/90-18</text><text x="124" y="175" fill="#7f9592">x 4</text>
    <text x="306" y="166" text-anchor="end">S/ 480.00</text>
    <rect x="110" y="194" width="210" height="52" rx="10" fill="#0c1d21"/>
    <text x="124" y="216">Cámara 3.00-18</text><text x="124" y="235" fill="#7f9592">x 4</text>
    <text x="306" y="226" text-anchor="end">S/ 96.00</text>
  </g>
  <line x1="110" y1="266" x2="320" y2="266" stroke="#1f3d43"/>
  <text x="114" y="292" fill="#7f9592" font-size="13">IGV (calculado en servidor)</text>
  <text x="316" y="292" fill="#cfe3e0" font-size="13" text-anchor="end">S/ 103.68</text>
  <text x="114" y="324" fill="#e8f1ef" font-size="16" font-weight="700">Total</text>
  <text x="316" y="324" fill="#2dd4bf" font-size="20" font-weight="700" text-anchor="end">S/ 679.68</text>
  <rect x="110" y="350" width="210" height="46" rx="12" fill="#2dd4bf"/>
  <text x="215" y="379" fill="#042f2b" font-size="15" font-weight="700" text-anchor="middle">Enviar por WhatsApp</text>
  <text x="215" y="432" fill="#4b6b67" font-size="11" text-anchor="middle">2-5 min por cotización</text>

  <!-- arrow -->
  <path d="M370 250 H470" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M462 240 L478 250 L462 260" fill="none" stroke="#2dd4bf" stroke-width="3"/>
  <text x="420" y="232" fill="#7f9592" font-size="12" text-anchor="middle">enlace firmado</text>
  <text x="420" y="278" fill="#7f9592" font-size="12" text-anchor="middle">que vence</text>

  <!-- customer approval card -->
  <rect x="500" y="120" width="250" height="260" rx="18" fill="#10262b" stroke="#2f5359"/>
  <text x="525" y="158" fill="#e8f1ef" font-size="16" font-weight="700">Cotización N° 0000</text>
  <rect x="525" y="178" width="200" height="12" rx="6" fill="#1f3d43"/>
  <rect x="525" y="200" width="160" height="12" rx="6" fill="#1f3d43"/>
  <rect x="525" y="222" width="180" height="12" rx="6" fill="#1f3d43"/>
  <rect x="525" y="262" width="200" height="46" rx="12" fill="#34d399"/>
  <text x="625" y="291" fill="#052e1c" font-size="15" font-weight="700" text-anchor="middle">Aprobar en línea</text>
  <text x="625" y="340" fill="#7f9592" font-size="12" text-anchor="middle">PDF desglosado</text>
  <text x="625" y="362" fill="#4b6b67" font-size="11" text-anchor="middle">Ilustración con datos ficticios</text>
</svg>
