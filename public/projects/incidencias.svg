<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <!-- Illustration (fictitious data): helpdesk board with ticket state machine and audit trail. -->
  <rect width="800" height="500" rx="18" fill="#0a1416"/>
  <rect x="0" y="0" width="190" height="500" rx="18" fill="#0f2024"/>
  <rect x="172" y="0" width="18" height="500" fill="#0f2024"/>
  <text x="28" y="48" fill="#e8f1ef" font-size="17" font-weight="700">Mesa de Ayuda</text>
  <g font-size="14" fill="#9fb3b0">
    <rect x="18" y="74" width="154" height="36" rx="10" fill="#17343a"/>
    <text x="32" y="97" fill="#2dd4bf" font-weight="700">Tickets</text>
    <text x="32" y="140">Usuarios y roles</text>
    <text x="32" y="176">Auditoría</text>
    <text x="32" y="212">API · Swagger</text>
  </g>
  <rect x="18" y="420" width="154" height="56" rx="10" fill="#122a2f"/>
  <text x="32" y="443" fill="#9fb3b0" font-size="12">Sesión JWT</text>
  <text x="32" y="463" fill="#34d399" font-size="12">refresh rotativo ✓</text>

  <text x="220" y="52" fill="#e8f1ef" font-size="20" font-weight="700">Tickets</text>
  <g font-size="13">
    <text x="220" y="92" fill="#9fb3b0" font-weight="700">ABIERTO</text>
    <text x="410" y="92" fill="#9fb3b0" font-weight="700">EN PROCESO</text>
    <text x="600" y="92" fill="#9fb3b0" font-weight="700">RESUELTO</text>
  </g>
  <g>
    <rect x="220" y="108" width="170" height="74" rx="12" fill="#10262b" stroke="#1f3d43"/>
    <text x="234" y="134" fill="#e8f1ef" font-size="14">#1024 Sin acceso</text>
    <rect x="234" y="150" width="56" height="18" rx="9" fill="#3b1d1d"/><text x="242" y="163" fill="#f87171" font-size="11">Alta</text>
    <rect x="220" y="194" width="170" height="74" rx="12" fill="#10262b" stroke="#1f3d43"/>
    <text x="234" y="220" fill="#e8f1ef" font-size="14">#1027 Impresora</text>
    <rect x="234" y="236" width="62" height="18" rx="9" fill="#3a3112"/><text x="242" y="249" fill="#fbbf24" font-size="11">Media</text>

    <rect x="410" y="108" width="170" height="74" rx="12" fill="#10262b" stroke="#2dd4bf"/>
    <text x="424" y="134" fill="#e8f1ef" font-size="14">#1019 Correo</text>
    <text x="424" y="164" fill="#7f9592" font-size="12">Asignado · soporte</text>

    <rect x="600" y="108" width="170" height="74" rx="12" fill="#10262b" stroke="#1f3d43"/>
    <text x="614" y="134" fill="#e8f1ef" font-size="14">#1011 VPN</text>
    <text x="614" y="164" fill="#34d399" font-size="12">Cerrado ✓</text>
  </g>

  <!-- state machine -->
  <rect x="220" y="296" width="550" height="96" rx="14" fill="#0f2024" stroke="#1f3d43"/>
  <text x="240" y="322" fill="#2dd4bf" font-size="12" font-weight="700">MÁQUINA DE ESTADOS (VALIDADA EN LA API)</text>
  <g font-size="13" fill="#e8f1ef">
    <rect x="240" y="338" width="100" height="36" rx="10" fill="#17343a"/><text x="290" y="361" text-anchor="middle">Abierto</text>
    <rect x="380" y="338" width="110" height="36" rx="10" fill="#17343a"/><text x="435" y="361" text-anchor="middle">En proceso</text>
    <rect x="530" y="338" width="100" height="36" rx="10" fill="#17343a"/><text x="580" y="361" text-anchor="middle">Resuelto</text>
  </g>
  <path d="M344 356 H374 M494 356 H524" stroke="#2dd4bf" stroke-width="2"/>
  <text x="648" y="352" fill="#f87171" font-size="12">salto inválido</text>
  <text x="648" y="370" fill="#f87171" font-size="12">→ HTTP 400</text>

  <rect x="220" y="408" width="550" height="68" rx="14" fill="#0f2024" stroke="#1f3d43"/>
  <text x="240" y="434" fill="#9fb3b0" font-size="12" font-weight="700">AUDITORÍA</text>
  <text x="240" y="458" fill="#cfe3e0" font-size="13">#1019 Abierto → En proceso · usuario: soporte · 10:42</text>
  <text x="760" y="494" fill="#4b6b67" font-size="10" text-anchor="end">Ilustración con datos ficticios</text>
</svg>
