<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <!-- Illustration (fictitious data) of an assistant with an agent, tools and human review. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1d21"/>
      <stop offset="1" stop-color="#081214"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="40" rx="18" fill="#10262b"/>
  <rect x="0" y="22" width="800" height="18" fill="#10262b"/>
  <circle cx="24" cy="20" r="6" fill="#f87171"/><circle cx="44" cy="20" r="6" fill="#fbbf24"/><circle cx="64" cy="20" r="6" fill="#34d399"/>
  <text x="400" y="25" fill="#7f9592" font-size="13" text-anchor="middle">Asistente · módulo contable</text>

  <!-- user question -->
  <rect x="300" y="64" width="470" height="44" rx="14" fill="#1b3a40"/>
  <text x="318" y="91" fill="#e8f1ef" font-size="15">¿Qué asientos del mes no cuadran con el mayor?</text>

  <!-- agent steps -->
  <rect x="30" y="128" width="480" height="168" rx="14" fill="#0f2226" stroke="#1f3d43"/>
  <text x="50" y="156" fill="#2dd4bf" font-size="13" font-weight="700">AGENTE · PASOS</text>
  <g font-size="14" fill="#cfe3e0">
    <circle cx="58" cy="186" r="9" fill="#2dd4bf"/><text x="54" y="191" fill="#042f2b" font-size="12" font-weight="700">✓</text>
    <text x="78" y="191">check_integrity(asientos, mes)</text>
    <circle cx="58" cy="220" r="9" fill="#2dd4bf"/><text x="54" y="225" fill="#042f2b" font-size="12" font-weight="700">✓</text>
    <text x="78" y="225">compare_balances(mayor, diario)</text>
    <circle cx="58" cy="254" r="9" fill="#22d3ee"/><text x="54" y="259" fill="#042f2b" font-size="12" font-weight="700">↻</text>
    <text x="78" y="259">buscar política aplicable (RAG)</text>
  </g>

  <!-- result card -->
  <rect x="30" y="314" width="480" height="150" rx="14" fill="#0f2226" stroke="#1f3d43"/>
  <text x="50" y="344" fill="#e8f1ef" font-size="15" font-weight="700">3 diferencias encontradas</text>
  <rect x="50" y="362" width="440" height="10" rx="5" fill="#1b3a40"/>
  <rect x="50" y="362" width="300" height="10" rx="5" fill="url(#acc)"/>
  <rect x="50" y="384" width="440" height="10" rx="5" fill="#1b3a40"/>
  <rect x="50" y="384" width="190" height="10" rx="5" fill="url(#acc)"/>
  <rect x="50" y="406" width="440" height="10" rx="5" fill="#1b3a40"/>
  <rect x="50" y="406" width="110" height="10" rx="5" fill="url(#acc)"/>
  <text x="50" y="446" fill="#7f9592" font-size="12">Cálculo en Python/SQL · el modelo solo explica</text>

  <!-- human review -->
  <rect x="540" y="128" width="230" height="336" rx="14" fill="#10262b" stroke="#1f3d43"/>
  <text x="560" y="156" fill="#fbbf24" font-size="13" font-weight="700">REVISIÓN HUMANA</text>
  <rect x="560" y="174" width="190" height="96" rx="10" fill="#0c1d21"/>
  <text x="574" y="200" fill="#cfe3e0" font-size="13">Propuesta de ajuste</text>
  <text x="574" y="224" fill="#7f9592" font-size="12">En pausa hasta que</text>
  <text x="574" y="242" fill="#7f9592" font-size="12">el contador apruebe</text>
  <rect x="560" y="290" width="190" height="40" rx="10" fill="#2dd4bf"/>
  <text x="655" y="315" fill="#042f2b" font-size="14" font-weight="700" text-anchor="middle">Aprobar</text>
  <rect x="560" y="340" width="190" height="40" rx="10" fill="none" stroke="#2f5359"/>
  <text x="655" y="365" fill="#cfe3e0" font-size="14" text-anchor="middle">Pedir cambios</text>
  <text x="560" y="420" fill="#7f9592" font-size="12">Traza guardada · reanudable</text>
  <text x="560" y="444" fill="#4b6b67" font-size="11">Ilustración con datos ficticios</text>
</svg>
